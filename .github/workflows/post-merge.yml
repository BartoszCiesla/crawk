name: Post-Merge Analysis
on:
  push:
    branches:
      - master
permissions: {}
jobs:
  coverage:
    name: Coverage
    permissions:
      contents: read # For checking the code in the repository.
    runs-on: ubuntu-latest
    environment: codecov
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: false
    if: ${{ github.repository_owner == 'BartoszCiesla' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: llvm-tools-preview
      - name: Install cargo tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-llvm-cov, cargo-nextest
      - name: Generate coverage
        run: cargo llvm-cov nextest --cargo-profile fast-build --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  self_score:
    name: Self Score (cargo-crap)
    permissions:
      contents: read # For checking the code in the repository.
      security-events: write # For uploading SARIF to GitHub Code Scanning.
    runs-on: ubuntu-latest
    concurrency:
      group: self-score-${{ github.ref }}
      cancel-in-progress: false
    if: ${{ github.repository_owner == 'BartoszCiesla' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: llvm-tools-preview
      - name: Install cargo tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-llvm-cov, cargo-crap
      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info
      - name: Generate cargo-crap SARIF report
        run: cargo crap --lcov lcov.info --format sarif --output crap.sarif
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: crap.sarif
          category: cargo-crap

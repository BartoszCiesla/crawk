name: Post-Merge Analysis
on:
  push:
    branches:
      - master
permissions: {}
jobs:
  coverage:
    name: Coverage
    permissions:
      contents: read # For checking the code in the repository.
    runs-on: ubuntu-latest
    environment: codecov
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: false
    if: ${{ github.repository_owner == 'BartoszCiesla' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools-preview
      - name: Install cargo tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov, cargo-nextest
      - name: Generate coverage
        run: cargo llvm-cov nextest --cargo-profile fast-build --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  self_score:
    name: Self Score (cargo-crap)
    permissions:
      contents: read # For checking the code in the repository.
      security-events: write # For uploading SARIF to GitHub Code Scanning.
    runs-on: ubuntu-latest
    concurrency:
      group: self-score-${{ github.ref }}
      cancel-in-progress: false
    if: ${{ github.repository_owner == 'BartoszCiesla' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools-preview
      - name: Install cargo tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov, cargo-crap
      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info
      - name: Generate cargo-crap SARIF report
        run: cargo crap --lcov lcov.info --format sarif --output crap.sarif
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: crap.sarif
          category: cargo-crap

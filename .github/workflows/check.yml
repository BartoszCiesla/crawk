name: Checks
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions: {}
jobs:
  prek-checks-pr:
    name: Prek Checks (PR)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read # For checking the code in the repository.
    runs-on: ubuntu-latest
    concurrency:
      group: prek-checks-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Full history needed for base..head diff.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
      - name: Install cargo tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-sort, cargo-machete, cargo-sort, cargo-nextest, cargo-deny, cargo-llvm-cov, cargo-crap
      - name: Run pre-commit checks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          extra-args: '--hook-stage pre-commit --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}'
      - name: Run pre-push checks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          extra-args: '--hook-stage pre-push --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}'
  prek-checks-push:
    name: Prek Checks (Push)
    if: github.event_name == 'push'
    permissions:
      contents: read # For checking the code in the repository.
    runs-on: ubuntu-latest
    concurrency:
      group: prek-checks-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
      - name: Install cargo tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-sort, cargo-machete, cargo-sort, cargo-nextest, cargo-deny, cargo-llvm-cov, cargo-crap
      - name: Run pre-commit checks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          extra-args: '--hook-stage pre-commit --all-files'
      - name: Run pre-push checks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          extra-args: '--hook-stage pre-push --all-files'
  build-checks:
    name: Build Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    concurrency:
      group: build-checks-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --target "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}
      - name: Test
        run: cargo test --target "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}
          RUST_BACKTRACE: "0"
  # `cargo publish` verifies inside target/package/, where build.rs still finds this
  # repository. `cargo install` and docs.rs build the bare tarball, so build it the same way.
  package-checks:
    name: Package Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    concurrency:
      group: package-checks-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Packaged sources carry a fixed 2006 mtime, so cargo would call a restored
          # build of them fresh and never run the packaged build.rs.
          cache: false
      - name: Package and unpack outside the repository
        run: |
          cargo package --no-verify --locked
          mkdir "${RUNNER_TEMP}/package"
          tar -xzf target/package/crawk-*.crate -C "${RUNNER_TEMP}/package" --strip-components=1
      - name: Build packaged crate
        working-directory: ${{ runner.temp }}/package
        run: cargo build --locked
      - name: Document packaged crate
        working-directory: ${{ runner.temp }}/package
        run: cargo doc --no-deps --lib --locked
      - name: Version reports the packaged commit
        run: |
          commit="$(git rev-parse HEAD | cut -c1-7)"
          "${RUNNER_TEMP}/package/target/debug/crawk" --version | grep -F "(${commit})"
  # Every other job builds with rust-toolchain.toml, so nothing else would notice a
  # dependency bump or a newer API pushing the real minimum past `rust-version`.
  msrv-checks:
    name: MSRV Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    concurrency:
      group: msrv-checks-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "${msrv}"
          echo "version=${msrv}" >> "$GITHUB_OUTPUT"
      - name: Install MSRV toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # Library and binaries only: what `cargo install` and dependents build, build.rs
      # included. Dev-dependencies never reach users, so they do not bound the MSRV.
      - name: Check on MSRV
        run: cargo +"${MSRV}" check --locked
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
      - name: Crate docs state the MSRV
        run: grep -F "Requires Rust **${MSRV}**" src/lib.rs
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
  nix-checks:
    name: Nix Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    concurrency:
      group: nix-checks-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: nix develop resolves toolchain
        run: nix develop --command cargo --version
      - name: nix build produces package
        run: nix build .#default
  finalize:
    name: Finalize Checks
    runs-on: ubuntu-latest
    concurrency:
      group: finalize-${{ github.ref }}
      cancel-in-progress: false
    needs:
      - prek-checks-pr
      - prek-checks-push
      - build-checks
      - package-checks
      - msrv-checks
      - nix-checks
    if: always()
    steps:
      - name: Exit with appropriate code
        env:
          CHECKS_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$CHECKS_FAILED" = "true" ]; then
            echo "❌ Some checks failed or were cancelled"
            exit 1
          else
            echo "✅ All checks passed successfully"
            exit 0
          fi

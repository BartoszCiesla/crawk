name: Advisories
on:
  schedule:
    # A RustSec advisory lands against an unchanged Cargo.lock, which no
    # push-triggered check sees until something else gets pushed.
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  advisories:
    name: Advisory Checks
    permissions:
      contents: read # For checking the code in the repository.
    runs-on: ubuntu-latest
    concurrency:
      group: advisories-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # Nothing gets compiled, so there is nothing worth caching.
          cache: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny
      - name: Check advisories
        run: cargo deny --locked check advisories

allow-unwrap-in-tests = true
allow-expect-in-tests = true
msrv = "1.88"
cognitive-complexity-threshold = 30
disallowed-methods = [
    { path = "cargo_metadata::Target::is_lib", reason = "knows the plain `lib` kind only; use `discover::is_library_target`" },
    { path = "cargo_metadata::Target::is_rlib", reason = "one library crate type of six; use `discover::is_library_target`" },
    { path = "cargo_metadata::Target::is_dylib", reason = "one library crate type of six; use `discover::is_library_target`" },
    { path = "cargo_metadata::Target::is_cdylib", reason = "one library crate type of six; use `discover::is_library_target`" },
    { path = "cargo_metadata::Target::is_staticlib", reason = "one library crate type of six; use `discover::is_library_target`" },
    { path = "cargo_metadata::Target::is_proc_macro", reason = "one library crate type of six; use `discover::is_library_target`" },
]

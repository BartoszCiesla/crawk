# crawk architectural contract
# Layer order: highest first. A module may depend only on modules listed
# LATER (lower layers); an upward dependency is a violation. Each pattern
# covers its whole module subtree.
#
# strict-layers = every module must be covered by some group (a new top-level
# module that nobody slots in fails the gate instead of slipping through).
#
# deny-same-layer is the crate-wide default (each group may override it). Off
# here: sibling submodules within one subtree are same-layer by design.
#
# deny-cycles bans dependency loops. The only loop crawk has is
# rules <-> rules::eval <-> rules::load, which is a parent re-exporting its own
# submodules — containment, skipped by default — so the gate starts empty and
# catches the first real tangle. No allow-cycle entries needed.
#
# Note: the lib -> bin direction is not encoded anywhere on purpose — cargo's
# target separation already guarantees the library cannot depend on the
# binary's modules, so a rule for it would be dead. The layer groups below each
# scope to a single target; the bin -> lib direction is covered by the restrict
# allowances at the bottom (facade discipline), not by a layer order.

[check]
strict-layers = true
deny-same-layer = false
deny-cycles = true

# Binary target (`crawk` bin) internal flow, entry point highest. Catches an
# accidental back-edge, e.g. cli -> logger or format -> main.
[[check.layers]]
name = "bin"
order = [
    "main",
    "logger",
    "cli",
    "format",
]

# Library dependency stack, facade (`lib`) highest, foundation lowest, in
# topological order. Everything above depends only downward onto the primitives
# below it; a leaf (constants / reference / cache) must never reach back up.
[[check.layers]]
name = "lib"
order = [
    "lib",
    "analyzer",
    "rules",
    "graph",
    "resolve",
    "parser",
    "error",
    "discover",
    "model",
    "reference",
    "module_path",
    "utils",
    "cache",
    "constants",
    "version",
]

# Overlay: internal hierarchy of the graph subsystem. The `lib` group treats all
# of `graph` as one layer; this overlapping group pins `graph::edges` as the
# primitive the other graph submodules (cycles / orphans / paths) build on.
[[check.layers]]
name = "graph-internals"
order = [
    "graph",
    "graph::cycles",
    "graph::orphans",
    "graph::paths",
    "graph::edges",
]

# The rules below split the work: `restrict` draws the outbound boundary of
# each bin-target scope (an allow-list — a new lib module is out of a bin
# scope's reach until somebody lists it), while `deny` pins the point bans on
# the lib side, where the default deliberately stays open (a new legal
# internal dependency must not become a config edit on review). Subtree
# matching is opt-in in both — `foo::*` covers foo AND its submodules, bare
# `foo` only that exact module — so targets use `::*` to stay covered when a
# module is later split into submodules. All rules pass on the current graph:
# they prevent regressions, they do not fix anything.

# -- bin target: restrict allowances (facade discipline) ----------------------
# Each bin scope carries its full allowance instead of a deny matrix. A facade
# import (crawk::Analyzer, re-exported from lib.rs) yields an edge to the
# synthetic `lib` node — allowed below; a full-path import (crawk::parser::X)
# yields an edge to the concrete module, which no allowance lists — the facade
# bypass is caught by default. Edges inside a scope's own subtree are exempt
# and never listed.

# The rendering layer consumes finished results (AnalysisResult,
# DependencyGraph, CheckReport) through the lib facade — and nothing else.
# Result types flow through `lib` re-exports, so the facade is the only
# lib-side contact format needs; the engine (parser / discover / resolve) and
# the orchestrator (analyzer) are out of reach by omission.
[[check.restrict]]
from = "format::*"
to = ["lib"]

# main orchestrates: parse args (cli), configure logging (logger), call the
# facade (lib -> Analyzer), render (format), print version metadata. Reaching
# past the facade would open a second, parallel orchestration path in the
# binary — the most likely spot for a future shortcut. (Bare `main` is exact
# by design: children of the bin root are flat top-level modules, so a
# `main::x` module can never exist.)
[[check.restrict]]
from = "main"
to = ["cli", "format::*", "lib", "logger", "version"]

# cli is pure interface definition (clap derive); its only legal lib-target
# contact is `version` (--version/help text). Rendering results is format's
# job, orchestrated by main — even the facade and orchestrator are out of
# bounds: semantic validation that needs the engine belongs to main.
[[check.restrict]]
from = "cli::*"
to = ["version"]

# logger configures tracing from verbosity flags — hence the legal
# logger -> cli edge, and nothing else. It must not leak presentation logic
# into logging infrastructure.
[[check.restrict]]
from = "logger::*"
to = ["cli"]

# -- lib target: deny point bans ----------------------------------------------
# The lib layer order puts rules and graph above the source engine
# (parser / discover / resolve), so layers would let them reach down into it.
# Both must stay pure over already-collected data. Deny (not restrict) is
# deliberate here: lib modules keep the open default, so only the named
# reaches are banned.

# graph is a pure structure (edges, Tarjan SCC, fan-in, shortest paths) over
# collected references — no source I/O. Reaching into the engine would end
# filesystem-free graph tests; orchestration belongs to analyzer.
[[check.deny]]
from = "graph::*"
to = "parser::*"

[[check.deny]]
from = "graph::*"
to = "discover::*"

[[check.deny]]
from = "graph::*"
to = "resolve::*"

# rules contract: input = DependencyGraph + TOML config, output = CheckReport.
# Touching sources would make rule evaluation depend on file state instead of
# the provided graph — no more deterministic evaluation on synthetic graphs.
[[check.deny]]
from = "rules::*"
to = "parser::*"

[[check.deny]]
from = "rules::*"
to = "discover::*"

[[check.deny]]
from = "rules::*"
to = "resolve::*"

# parser works on a single file (syn AST + token stream); crate layout
# knowledge (cargo metadata, module -> file mapping) is discover's. Only
# analyzer joins the two axes. The layer order (parser above discover) permits
# this edge — hence the deny.
[[check.deny]]
from = "parser::*"
to = "discover::*"

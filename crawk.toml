# crawk architectural contract
# Layer order: highest first. A module may depend only on modules listed
# LATER (lower layers); an upward dependency is a violation. Each pattern
# covers its whole module subtree.
#
# strict-layers = every module must be covered by some group (a new top-level
# module that nobody slots in fails the gate instead of slipping through).
#
# deny-same-layer is the crate-wide default (each group may override it). Off
# here: sibling submodules within one subtree are same-layer by design.
#
# Note: the bin -> lib direction is NOT encoded below on purpose — cargo's
# target separation already guarantees the library cannot depend on the
# binary's modules, so a rule for it would be redundant. The groups below each
# scope to a single target and express only the orderings crawk can actually
# add value on.

[check]
strict-layers = true
deny-same-layer = false

# Binary target (`crawk` bin) internal flow, entry point highest. Catches an
# accidental back-edge, e.g. cli -> logger or format -> main.
[[check.layers]]
name = "bin"
order = [
    "main",
    "logger",
    "cli",
    "format",
]

# Library dependency stack, facade (`lib`) highest, foundation lowest, in
# topological order. Everything above depends only downward onto the primitives
# below it; a leaf (constants / reference / cache) must never reach back up.
[[check.layers]]
name = "lib"
order = [
    "lib",
    "analyzer",
    "rules",
    "graph",
    "resolve",
    "parser",
    "error",
    "discover",
    "model",
    "reference",
    "utils",
    "cache",
    "constants",
    "version",
]

# Overlay: internal hierarchy of the graph subsystem. The `lib` group treats all
# of `graph` as one layer; this overlapping group pins `graph::edges` as the
# primitive the other graph submodules (cycles / orphans / paths) build on.
[[check.layers]]
name = "graph-internals"
order = [
    "graph",
    "graph::cycles",
    "graph::orphans",
    "graph::paths",
    "graph::edges",
]
